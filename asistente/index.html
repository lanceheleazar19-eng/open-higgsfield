<title>Asistente Nexo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: chat on the left, the agenda as a slim column on the right; stacked on phones. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#101922; --muted:#566676;
  --line:#D5DDE4; --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DCEFEE;
  --warn:#9A5B00; --danger:#B3261E;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151E27; --surface-2:#1A2530; --ink:#E6ECF2; --muted:#93A2B1;
  --line:#26333F; --accent:#3CC2B8; --accent-ink:#05201E; --accent-soft:#16332F;
  --warn:#E0A24A; --danger:#F08A80; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E27; --surface-2:#1A2530; --ink:#E6ECF2; --muted:#93A2B1;
  --line:#26333F; --accent:#3CC2B8; --accent-ink:#05201E; --accent-soft:#16332F;
  --warn:#E0A24A; --danger:#F08A80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent) 70%);box-shadow:0 0 0 4px var(--accent-soft)}
h1{font-family:var(--f-display);font-size:1.35rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.mode{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.mode.ai{color:var(--accent);border-color:var(--accent)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;height:min(720px,calc(100dvh - 120px))}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{max-width:85%;display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.user{align-self:flex-end}
.bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.bot .bubble{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.thinking{color:var(--muted);font-style:italic}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface)}
.card .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card a.go{margin-left:auto;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:.9rem}
.card a.go:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
form.composer input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:11px 12px}
.btn.ghost.on{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
aside.agenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;align-self:start;max-height:calc(100dvh - 120px);overflow-y:auto}
aside h2{font-family:var(--f-display);font-size:1rem;margin:0 0 12px}
.day{margin-bottom:14px}
.day h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:600}
.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item time{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.item .t{overflow-wrap:anywhere}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin-left:6px}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.78rem;margin:10px 0 0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .chat{height:70dvh}
  aside.agenda{max-height:none}
}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="orb" aria-hidden="true"></div>
      <div>
        <h1>Nexo</h1>
        <p class="sub">Tu asistente: charla, citas y webs</p>
      </div>
    </div>
    <span class="mode" id="mode">Conectando…</span>
  </header>

  <section class="chat" aria-label="Chat con Nexo">
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <button type="button" class="btn ghost" id="mic" hidden aria-label="Dictar">🎤</button>
      <input id="box" autocomplete="off" placeholder="Escribe algo… p. ej. «cita con el dentista mañana a las 5»" aria-label="Mensaje">
      <button type="button" class="btn ghost" id="stop" hidden>Parar</button>
      <button class="btn" id="send">Enviar</button>
    </form>
  </section>

  <aside class="agenda" aria-label="Agenda">
    <h2>Tu agenda</h2>
    <div id="agenda"></div>
    <p class="note">Las citas se guardan solo en este navegador.</p>
  </aside>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const log=$("log"), box=$("box"), form=$("composer"), sendBtn=$("send"), stopBtn=$("stop"), micBtn=$("mic"), modeEl=$("mode");
const KEY="nexo-citas-v1";
const DAYS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DAYS_N=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const startDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function dayLabel(s){
  const t=startDay(new Date()), d=fromYmd(s), diff=Math.round((d-t)/864e5);
  if(diff===0) return "Hoy"; if(diff===1) return "Mañana"; if(diff===2) return "Pasado mañana";
  const w=DAYS[d.getDay()]; return w.charAt(0).toUpperCase()+w.slice(1)+" "+d.getDate()+" de "+MONTHS[d.getMonth()];
}

/* ---------- storage ---------- */
let citas=[];
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ citas=JSON.parse(raw)||[]; }catch(e){ citas=[]; } return; }
  const t=startDay(new Date());
  citas=[
    {id:uid(),title:"Dentista",date:ymd(addDays(t,1)),time:"17:30",example:true},
    {id:uid(),title:"Entreno de pierna",date:ymd(addDays(t,2)),time:"19:00",example:true}
  ];
  save();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(citas)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
const sortKey=c=>c.date+" "+(c.time||"00:00");

/* ---------- agenda ---------- */
function renderAgenda(){
  const el=$("agenda"); el.textContent="";
  const today=ymd(new Date());
  const up=citas.filter(c=>c.date>=today).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
  if(!up.length){ const p=document.createElement("p"); p.className="empty"; p.textContent="No tienes citas. Prueba: «recuérdame estudiar el viernes a las 6»."; el.append(p); return; }
  let cur=null, box=null;
  for(const c of up){
    if(c.date!==cur){ cur=c.date; box=document.createElement("div"); box.className="day";
      const h=document.createElement("h3"); h.textContent=dayLabel(c.date); box.append(h); el.append(box); }
    const row=document.createElement("div"); row.className="item";
    const tm=document.createElement("time"); tm.textContent=c.time||"—";
    const tt=document.createElement("span"); tt.className="t"; tt.textContent=c.title;
    if(c.example){ const g=document.createElement("span"); g.className="tag"; g.textContent="ejemplo"; tt.append(g); }
    const del=document.createElement("button"); del.className="del"; del.type="button"; del.textContent="×";
    del.setAttribute("aria-label","Borrar "+c.title);
    del.onclick=()=>{ removeCita(c.id); };
    row.append(tm,tt,del); box.append(row);
  }
}
function addCita(title,date,time){
  const c={id:uid(),title:title||"Cita",date,time:time||null};
  citas.push(c); save(); renderAgenda(); return c;
}
let lastRemoved=[];
function removeCita(id){
  const i=citas.findIndex(c=>c.id===id); if(i<0) return null;
  const [c]=citas.splice(i,1); lastRemoved=[c]; save(); renderAgenda(); return c;
}
function undoRemove(){ if(!lastRemoved.length) return; citas.push(...lastRemoved); lastRemoved=[]; save(); renderAgenda(); }
const describe=c=>c.title+" · "+dayLabel(c.date).toLowerCase()+(c.time?" a las "+c.time:"");

/* ---------- websites ---------- */
const SITES=[
  ["google maps","https://maps.google.com","Google Maps"],["maps","https://maps.google.com","Google Maps"],
  ["gmail","https://mail.google.com","Gmail"],["google drive","https://drive.google.com","Google Drive"],
  ["google","https://www.google.com","Google"],["youtube","https://www.youtube.com","YouTube"],
  ["instagram","https://www.instagram.com","Instagram"],["tiktok","https://www.tiktok.com","TikTok"],
  ["whatsapp","https://web.whatsapp.com","WhatsApp Web"],["twitter","https://x.com","X"],["x","https://x.com","X"],
  ["wikipedia","https://es.wikipedia.org","Wikipedia"],["amazon","https://www.amazon.es","Amazon"],
  ["netflix","https://www.netflix.com","Netflix"],["spotify","https://open.spotify.com","Spotify"],
  ["twitch","https://www.twitch.tv","Twitch"],["reddit","https://www.reddit.com","Reddit"],
  ["github","https://github.com","GitHub"],["chatgpt","https://chatgpt.com","ChatGPT"],["claude","https://claude.ai","Claude"],
  ["mercadona","https://tienda.mercadona.es","Mercadona"],["wallapop","https://es.wallapop.com","Wallapop"]
];
function norm(s){ return [...s].map(ch=>{const r=ch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); return r.length===ch.length?r:ch;}).join(""); }
function resolveSite(name, url, query, where){
  if(query){
    const q=encodeURIComponent(String(query).trim());
    const w=norm(String(where||"google"));
    if(w.includes("youtube")) return {url:"https://www.youtube.com/results?search_query="+q,label:"Buscar en YouTube"};
    if(w.includes("wikipedia")) return {url:"https://es.wikipedia.org/w/index.php?search="+q,label:"Buscar en Wikipedia"};
    if(w.includes("amazon")) return {url:"https://www.amazon.es/s?k="+q,label:"Buscar en Amazon"};
    return {url:"https://www.google.com/search?q="+q,label:"Buscar en Google"};
  }
  if(url){ let u=String(url).trim(); if(!/^https?:\/\//i.test(u)) u="https://"+u;
    try{ const p=new URL(u); if(p.protocol!=="https:"&&p.protocol!=="http:") throw 0; return {url:p.href,label:p.hostname}; }catch(e){ return null; } }
  const n=norm(String(name||"")).replace(/[¿?¡!.,]/g," ").trim();
  if(!n) return null;
  for(const [k,u,l] of SITES){ if(new RegExp("(^|\\s)"+k+"(\\s|$)").test(n)) return {url:u,label:l}; }
  if(/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(n.replace(/\s/g,""))) return resolveSite(null,n.replace(/\s/g,""));
  return {url:"https://www.google.com/search?q="+encodeURIComponent(name),label:"Buscar «"+name+"» en Google"};
}

/* ---------- chat UI ---------- */
function msg(role,text){
  const m=document.createElement("div"); m.className="msg "+role;
  const b=document.createElement("div"); b.className="bubble"; rich(b,text||"");
  m.append(b); log.append(m); log.scrollTop=log.scrollHeight; return {m,b};
}
function rich(el,text){
  el.textContent="";
  const clean=text.replace(/^#{1,6}\s+/gm,"").replace(/^\s*[-*]\s+/gm,"• ");
  for(const part of clean.split(/(\*\*[^*\n]+\*\*)/)){
    if(/^\*\*[^*\n]+\*\*$/.test(part)){ const s=document.createElement("strong"); s.textContent=part.slice(2,-2); el.append(s); }
    else if(part) el.append(part);
  }
}
function linkCard(host,res){
  const c=document.createElement("div"); c.className="card";
  const k=document.createElement("span"); k.className="k"; k.textContent="Web";
  const t=document.createElement("span"); t.textContent=res.label;
  const a=document.createElement("a"); a.className="go"; a.href=res.url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent="Abrir ↗";
  c.append(k,t,a); host.append(c); log.scrollTop=log.scrollHeight;
}
function infoCard(host,kind,text,undo){
  const c=document.createElement("div"); c.className="card";
  const k=document.createElement("span"); k.className="k"; k.textContent=kind;
  const t=document.createElement("span"); t.textContent=text; c.append(k,t);
  if(undo){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent="Deshacer"; b.style.marginLeft="auto";
    b.onclick=()=>{ undoRemove(); b.disabled=true; b.textContent="Recuperada"; }; c.append(b); }
  host.append(c); log.scrollTop=log.scrollHeight;
}
function chips(list){
  const m=document.createElement("div"); m.className="msg bot";
  const w=document.createElement("div"); w.className="chips";
  for(const s of list){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=s;
    b.onclick=()=>{ box.value=s; form.requestSubmit(); }; w.append(b); }
  m.append(w); log.append(m);
}

/* ---------- local rules (works without AI) ---------- */
function parseWhen(text){
  const n=norm(text), cuts=[]; const today=startDay(new Date());
  const take=re=>{ const m=re.exec(n); if(m) cuts.push([m.index,m.index+m[0].length]); return m; };
  let date=null, m;
  if(take(/\bpasado\s+manana\b/)) date=addDays(today,2);
  else if(take(/\bhoy\b/)) date=today;
  else {
    const re=/\bmanana\b/g; let mm;
    while((mm=re.exec(n))){ if(!/\bla\s+$/.test(n.slice(0,mm.index))){ cuts.push([mm.index,mm.index+6]); date=addDays(today,1); break; } }
  }
  if(!date && (m=take(new RegExp("\\b(?:el\\s+)?(?:dia\\s+)?(\\d{1,2})\\s+de\\s+("+MONTHS.join("|")+")(?:\\s+de\\s+(\\d{4}))?\\b")))){
    let y=m[3]?+m[3]:today.getFullYear(); let d=new Date(y,MONTHS.indexOf(m[2]),+m[1]); if(!m[3]&&d<today) d.setFullYear(y+1); date=d;
  }
  if(!date && (m=take(/\b(?:el\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):today.getFullYear(); let d=new Date(y,+m[2]-1,+m[1]); if(!m[3]&&d<today) d.setFullYear(y+1); date=d;
  }
  if(!date && (m=take(/\b(?:el\s+|este\s+|el\s+proximo\s+|proximo\s+)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/))){
    let diff=(DAYS_N.indexOf(m[1])-today.getDay()+7)%7; if(diff===0) diff=7; date=addDays(today,diff);
  }
  if(!date && (m=take(/\bel\s+dia\s+(\d{1,2})\b/))){
    let d=new Date(today.getFullYear(),today.getMonth(),+m[1]); if(d<today) d.setMonth(d.getMonth()+1); date=d;
  }
  const pm=!!take(/\b(?:de|por)\s+la\s+(?:tarde|noche)\b/);
  const am=!!take(/\b(?:de|por)\s+la\s+manana\b|\bde\s+madrugada\b/);
  let time=null;
  if(take(/\bal\s+mediodia\b/)) time={h:14,m:0};
  else if((m=take(/\b(?:a|sobre|hacia)\s+las?\s+(\d{1,2})(?:[:.h](\d{2}))?(?:\s*(?:h|horas)\b)?(?:\s+(y\s+media|y\s+cuarto|menos\s+cuarto))?/))||(m=take(/\b(\d{1,2})[:.](\d{2})\b/))){
    let h=+m[1], mi=m[2]?+m[2]:0;
    if(m[3]==="y media") mi=30; else if(m[3]==="y cuarto") mi=15; else if(m[3]==="menos cuarto"){ h=h-1; mi=45; }
    if(pm&&h<12) h+=12; else if(!am&&h>=1&&h<=7) h+=12;
    if(h>=0&&h<24&&mi<60) time={h,m:mi};
  }
  if(!date&&time){ const now=new Date(); date=(time.h*60+time.m>now.getHours()*60+now.getMinutes())?today:addDays(today,1); }
  return {date, time:time?pad(time.h)+":"+pad(time.m):null, cuts};
}
function stripCuts(text,cuts){
  let out=""; let pos=0;
  for(const ch of text){ const inCut=cuts.some(([a,b])=>pos>=a&&pos<b); if(!inCut) out+=ch; pos+=ch.length; }
  return out;
}
function cleanTitle(s){
  let t=s.replace(/[¿?¡!]/g," ").replace(/\s+/g," ").trim();
  const n=norm(t);
  const pre=/^(?:(?:oye|porfa|por favor)[, ]+)?(?:(?:recuerdame|recordarme|acuerdame)\s+(?:que\s+)?(?:tengo\s+)?|(?:apunta|anade|pon|crea|programa|agenda|guarda|mete)(?:me)?\s+(?:que\s+tengo\s+)?|tengo\s+|hay\s+)?(?:una\s+|un\s+)?/;
  const m=pre.exec(n); if(m) t=t.slice(m[0].length);
  t=t.replace(/\s+(?:a|el|para|de|del|en|y|que)\s*$/i,"").replace(/^\s*(?:para|de|el|la)\s+/i,"").trim();
  if(/^con\s/i.test(t)) t="Cita "+t;
  if(!t) t="Cita";
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function localReply(text){
  const n=norm(text).trim();
  const out=msg("bot","");
  const say=s=>rich(out.b,s);
  if(/\b(ayuda|que puedes hacer|que sabes hacer)\b/.test(n)){
    say("Puedo apuntar citas («dentista mañana a las 5»), decirte qué tienes («¿qué tengo esta semana?»), borrar citas («borra el dentista») y darte enlaces a webs («llévame a YouTube», «busca recetas baratas»)."); return;
  }
  let m;
  if((m=/^(?:oye\s+|porfa\s+)?(?:puedes\s+)?busca(?:r|me)?\s+(.+?)(?:\s+en\s+(google|youtube|wikipedia|amazon))?\s*[?.!]*$/.exec(n))){
    const start=n.indexOf(m[1]); const q=text.slice(start,start+m[1].length);
    const r=resolveSite(null,null,q,m[2]); say("Aquí tienes la búsqueda:"); linkCard(out.m,r); return;
  }
  if((m=/^(?:oye\s+|porfa\s+)?(?:puedes\s+)?(?:llevame|llevarme|abreme|abre|abrir|ir|ve|vamos|entra|entrar|ponme)\s+(?:a|en)?\s*(?:la\s+web\s+de\s+|la\s+pagina\s+de\s+|el\s+|la\s+)?(.+)$/.exec(n))){
    const start=n.lastIndexOf(m[1]); const name=text.slice(start).trim();
    const r=resolveSite(name); if(r){ say("Te dejo el enlace (se abre en otra pestaña):"); linkCard(out.m,r); return; }
  }
  if(/\b(borra|borrar|elimina|eliminar|cancela|cancelar|quita|quitar)\b/.test(n)){
    const w=parseWhen(text);
    const words=norm(stripCuts(text,w.cuts)).replace(/\b(borra|borrar|elimina|eliminar|cancela|cancelar|quita|quitar|la|el|mi|cita|citas|de|del|con|que|tengo)\b/g," ").split(/\s+/).filter(x=>x.length>2);
    let cand=citas.filter(c=>(!w.date||c.date===ymd(w.date))&&words.every(x=>norm(c.title).includes(x)));
    if(!words.length&&!w.date) cand=[];
    cand.sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
    if(!cand.length){ say("No encuentro esa cita. Dime cuál, por ejemplo: «borra el dentista»."); return; }
    const c=removeCita(cand[0].id); say("Hecho."); infoCard(out.m,"Borrada",describe(c),true); return;
  }
  if(/\b(que tengo|tengo algo|mis citas|mi agenda|ver agenda|ver citas|que hay)\b/.test(n)){
    const w=parseWhen(text); const today=ymd(new Date());
    let list=citas.filter(c=>c.date>=today);
    if(w.date) list=list.filter(c=>c.date===ymd(w.date));
    else if(/\bsemana\b/.test(n)){ const lim=ymd(addDays(startDay(new Date()),7)); list=list.filter(c=>c.date<=lim); }
    list.sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
    say(list.length? list.map(c=>"• "+describe(c)).join("\n") : "No tienes nada apuntado para entonces. ¡Día libre!"); return;
  }
  const w=parseWhen(text);
  if(w.date||/\b(cita|recuerdame|apunta|agenda|programa)\b/.test(n)){
    const date=w.date||startDay(new Date());
    const c=addCita(cleanTitle(stripCuts(text,w.cuts)),ymd(date),w.time);
    say("Apuntado ✅"); infoCard(out.m,"Cita",describe(c)); return;
  }
  if(/^(hola|buenas|hey|que tal|ey)\b/.test(n)){ say("¡Hola! Soy Nexo. Ahora mismo estoy en modo básico: apunto citas y te doy enlaces. Escribe «ayuda» para ver ejemplos."); return; }
  say("En modo básico solo entiendo órdenes sencillas (citas y webs). Para charlar de cualquier cosa, permite que la página use Claude cuando te lo pregunte.");
}

/* ---------- AI mode ---------- */
let sample=null, aiOn=false, toolsOn=false, ctl=null, busy=false;
const turns=[];
function rules(){
  const now=new Date(); const today=ymd(now);
  const up=citas.filter(c=>c.date>=today).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1).slice(0,40)
    .map(c=>`- id=${c.id} | ${c.date} ${c.time||"(sin hora)"} | ${c.title}`).join("\n")||"(ninguna)";
  return `Eres Nexo, un asistente personal simpático que habla en español de España, de tú, con frases cortas y naturales (como un colega listo). Puedes charlar de cualquier tema.
Hoy es ${DAYS[now.getDay()]} ${today}, hora local ${pad(now.getHours())}:${pad(now.getMinutes())}.
Tienes herramientas para la agenda y para webs. Úsalas siempre que te pidan apuntar, mover, ver o borrar citas, o ir a una web o buscar algo:
- Para una cita nueva, usa crear_cita con la fecha en formato AAAA-MM-DD y la hora HH:MM (24 h). "A las 5" sin más contexto suele ser 17:00. Si falta algo importante, pregunta.
- Para cambiar una cita: borrar_cita y luego crear_cita.
- Para "llévame a X", "abre X" o "busca X", usa abrir_web. No puedes abrir pestañas tú solo: di que dejas el enlace debajo.
No uses Markdown con títulos ni tablas. No inventes citas.
Citas guardadas ahora:
${up}`;
}
function toolsFor(host){
  return [
    {name:"crear_cita",description:"Guarda una cita o recordatorio en la agenda. Devuelve la cita guardada.",
     inputSchema:{type:"object",properties:{titulo:{type:"string"},fecha:{type:"string",description:"AAAA-MM-DD"},hora:{type:"string",description:"HH:MM en 24 h, opcional"}},required:["titulo","fecha"]},
     execute:(i)=>{ const f=String(i.fecha||""); if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) throw new Error("fecha debe ser AAAA-MM-DD");
       const h=i.hora?String(i.hora):null; if(h&&!/^\d{2}:\d{2}$/.test(h)) throw new Error("hora debe ser HH:MM");
       const c=addCita(String(i.titulo||"Cita").slice(0,120),f,h); infoCard(host,"Cita",describe(c)); return {ok:true,id:c.id,fecha:c.date,hora:c.time,titulo:c.title}; }},
    {name:"listar_citas",description:"Devuelve las citas guardadas entre dos fechas (AAAA-MM-DD, ambas opcionales).",
     inputSchema:{type:"object",properties:{desde:{type:"string"},hasta:{type:"string"}}},
     execute:(i)=>{ const d=i.desde?String(i.desde):ymd(new Date()); const h=i.hasta?String(i.hasta):"9999-12-31";
       return citas.filter(c=>c.date>=d&&c.date<=h).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1).map(c=>({id:c.id,fecha:c.date,hora:c.time,titulo:c.title})); }},
    {name:"borrar_cita",description:"Borra una cita por su id (el usuario puede deshacerlo). Devuelve la cita borrada.",
     inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
     execute:(i)=>{ const c=removeCita(String(i.id)); if(!c) throw new Error("No existe esa cita"); infoCard(host,"Borrada",describe(c),true); return {ok:true,titulo:c.title}; }},
    {name:"abrir_web",description:"Prepara un enlace para que el usuario lo abra: una web por nombre (p. ej. 'youtube'), una URL, o una búsqueda. Devuelve la URL.",
     inputSchema:{type:"object",properties:{sitio:{type:"string"},url:{type:"string"},busqueda:{type:"string"},buscar_en:{type:"string",description:"google, youtube, wikipedia o amazon"}}},
     execute:(i)=>{ const r=resolveSite(i.sitio,i.url,i.busqueda,i.buscar_en); if(!r) throw new Error("No sé qué web es"); linkCard(host,r); return {url:r.url}; }}
  ];
}
const ERR={not_granted:"No tengo permiso para usar Claude aquí. Sigo en modo básico.",sampling_disabled:"Claude no está disponible en esta cuenta. Sigo en modo básico.",
  rate_limited:"Vamos muy rápido o se ha llegado al límite de uso. Prueba en un rato.",session_expired:"Tienes que volver a iniciar sesión en Claude.",
  refused:"Eso no lo puedo responder. Prueba a preguntarlo de otra forma.",empty_completion:"No me ha salido respuesta. Prueba a decirlo de otra forma.",
  prompt_too_large:"La conversación es muy larga. Recarga la página para empezar de cero."};
async function aiReply(text){
  turns.push({role:"user",content:text});
  while(turns.length>16) turns.shift();
  while(turns.length&&turns[0].role!=="user") turns.shift();
  const out=msg("bot","Pensando…"); out.b.classList.add("thinking");
  ctl=new AbortController(); setBusy(true);
  try{
    const opts={signal:ctl.signal,cache:false,modelTier:"quick",onText:({text})=>{ out.b.classList.remove("thinking"); rich(out.b,text); log.scrollTop=log.scrollHeight; }};
    if(toolsOn) opts.tools=toolsFor(out.m);
    const res=await sample([{role:"user",content:rules()},...turns],opts);
    out.b.classList.remove("thinking"); rich(out.b,res.text);
    turns.push({role:"assistant",content:res.text});
  }catch(e){
    out.b.classList.remove("thinking");
    const code=e&&e.code;
    if(code==="cancelled"){ rich(out.b,(e.text||"")+(e.text?"\n":"")+"(parado)"); }
    else if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){
      setMode(false); out.m.remove(); turns.pop(); localReply(text); const n=msg("bot",ERR[code]||ERR.not_granted); n.b.classList.add("thinking");
    } else if(code==="tools_unavailable"){ toolsOn=false; rich(out.b,"No puedo usar la agenda con la IA en esta vista. Lo hago en modo básico:"); localReply(text); }
    else { rich(out.b,(e&&e.text?e.text+"\n\n":"")+(ERR[code]||"Se ha cortado la conexión. Vuelve a intentarlo.")); }
  }finally{ setBusy(false); ctl=null; }
}
function setBusy(b){ busy=b; sendBtn.disabled=b; stopBtn.hidden=!b; }
function setMode(on){ aiOn=on; modeEl.textContent=on?"IA activada":"Modo básico"; modeEl.classList.toggle("ai",on); }

stopBtn.onclick=()=>ctl&&ctl.abort();
form.addEventListener("submit",e=>{
  e.preventDefault(); const text=box.value.trim(); if(!text||busy) return;
  box.value=""; msg("user",text);
  if(aiOn) aiReply(text); else localReply(text);
});

/* ---------- dictation ---------- */
let dict=null;
function wireMic(d){
  dict=d; micBtn.hidden=false; let base="";
  d.onPartial(({text})=>{ if(text) box.value=(base?base+" ":"")+text; });
  d.onFinal(({text})=>{ base=(base+text).replace(/^\s+/,""); box.value=base; });
  d.onState(({state,reason})=>{
    const on=state!=="idle"; micBtn.classList.toggle("on",on); micBtn.setAttribute("aria-label",on?"Parar dictado":"Dictar");
    if(state==="idle"){ if(reason==="unavailable"||reason==="not_granted") micBtn.hidden=true; }
  });
  micBtn.onclick=()=>{
    if(d.active()){ d.stop().catch(()=>{}); return; }
    base=box.value.trim();
    d.start().catch(err=>{ if(err&&(err.code==="not_granted"||err.code==="unavailable")) micBtn.hidden=true; });
  };
}

/* ---------- boot ---------- */
load(); renderAgenda();
msg("bot","¡Hola! Soy Nexo 👋 Puedo charlar contigo, apuntarte citas y llevarte a webs. Prueba con algo de esto:");
chips(["Cita con el dentista mañana a las 5","¿Qué tengo esta semana?","Llévame a Google","Busca recetas baratas en YouTube","Cuéntame un dato curioso"]);
setMode(false); modeEl.textContent="Conectando…";
const C=window.claude;
if(C&&typeof C.use==="function"){
  C.use("sample").then(async s=>{
    if(!s){ setMode(false); return; }
    sample=s; let lim=null; try{ lim=await s.limits(); }catch(e){}
    toolsOn=!!(lim&&lim.tools); setMode(true);
  }).catch(()=>setMode(false));
  C.use("dictation").then(d=>{ if(d) wireMic(d); }).catch(()=>{});
} else { setMode(false); }
})();
</script>
